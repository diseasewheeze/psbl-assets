# League-wide settings shared by every PSBL automation.
#
# The Season 2027 Fantrax league. When the league renews for a new Season,
# change season_label here. Everything else (week dates, playoff weeks, number of
# playoff teams, the season calendar) is read from Fantrax automatically.

league_id: jhzw6k51mvafuvw7
season_label: "2027"
timezone: America/New_York

# PSBL league red accent used by Competition Desk posts.
color: 0xBD3039

competition:
  # The weekly report goes out at or after this local time on the morning a
  # fantasy week ends (normally Monday).
  report_time: "08:00"

  # Playoff race posts begin with this week's report and run through the
  # last regular-season week.
  playoff_race_start_week: 16

  # Teams just below the playoff line shown in the playoff race.
  bubble_depth: 3

  # Credited pitcher starts are not set here: the live scoreboard's "Pitcher
  # starts: X of Y" and the preview's projected starts use the Constitution's
  # cap from automation/core/sport.py (PITCHER_STARTS_PER_WEEK per calendar
  # week, so 14 for the two-week Championship; Article IX).

  # Weekly MLB games grid (posted after the matchup preview): a day is "light"
  # when this many MLB teams or fewer play (a typical Monday or Thursday), and
  # "heavy" when at least heavy_day_min_teams play (30 = a full slate). Light
  # days also give the preview's "Light-day games".
  light_day_max_teams: 20
  heavy_day_min_teams: 30

  # The Wooden Spoon (league tradition, no money, no rule change): when the
  # final regular-season standings are posted, the last-place franchise gets
  # the Wooden Spoon post in 📰│weekly-recap (its owner is mentioned if listed
  # under owners). Set false to stop it.
  wooden_spoon: true

  # Monthly Awards in 📰│weekly-recap (Manager of the Month, Best Record,
  # Biggest Single Week, Hard Luck), from Fantrax matchup scores. A week counts
  # for the month its last night (Sunday, Constitution 5.8) falls in; a
  # month's awards go out the morning the first week of the next month is
  # reported, and the season's last month
  # with the final regular-season week. The Manager of the Month holds the
  # "📅 Manager of the Month" Discord role until the next award (the
  # Commissioner moves the role by hand). Set false to stop it.
  monthly_awards: true

  # Season bounties: one-time goals announced in 📰│weekly-recap when first
  # reached. Each is claimed once per Season. Rewards are recognition only
  # (a Discord role, a mention); FAAB, picks, the draft, dues or money are
  # rejected. The Commissioner gives the role by hand.
  #
  #   id           unique key kept in the saved state; do not rename mid-season
  #   title        short name shown in Discord
  #   description  one line on what it takes
  #   type         team_season_points  first franchise to reach `threshold` season points
  #                team_week_points    first single week of at least `threshold` points
  #                                    (periods longer than one calendar week do not count)
  #                team_win_streak     first to `threshold` head-to-head wins in a row
  #                                    (a tie ends a streak)
  #                player_multi_homer  first MLB regular-season game in which a player on a
  #                                    PSBL roster hits `threshold` home runs (2 = a
  #                                    multi-homer game); checked the morning after
  #   threshold    the number to reach
  #   reward       optional; default "🎯 Bounty Hunter role for the Season"
  #
  # Default thresholds are estimates from the scoring values (Article VIII,
  # automation/core/sport.py) and every MLB player's 2021-2026 seasons
  # (research/scoring): 10 hitter slots filled about 6 days a week at about
  # 5.5 points a game is about 330, 7 credited starts at about 20 points is
  # about 140, and 3 relief slots add about 50, so a typical team week is about
  # 470 to 520 points (week to week about +/-65) and a 22-week regular season
  # (a short Week 1, a two-week All-Star Week) about 10,500 to 11,500:
  #   650 in a week    claimed in roughly three Seasons of four
  #   6 straight wins  claimed in ~95% of seasons, typically around Week 8
  #   11,500 points    the front-runner gets there around Week 21
  #   multi-homer game usually within the first few days
  # Check them against real weekly scores after a few weeks of Season 2027
  # and adjust before anyone is close (ids stay the same within a Season).
  bounties:
    - id: first-multi-homer
      title: "First Multi-Homer Game"
      description: "First PSBL-rostered player to hit two home runs in an MLB regular-season game."
      type: player_multi_homer
      threshold: 2
      reward: "🎯 Bounty Hunter role for the Season"
    - id: big-week-650
      title: "The 650 Club"
      description: "First franchise to score 650 points in a single week."
      type: team_week_points
      threshold: 650
      reward: "🎯 Bounty Hunter role for the Season"
    - id: hot-streak-6
      title: "Six Straight"
      description: "First franchise to win six head-to-head matchups in a row."
      type: team_win_streak
      threshold: 6
      reward: "🎯 Bounty Hunter role for the Season"
    - id: season-11500
      title: "The 11,500 Mark"
      description: "First franchise to reach 11,500 season points."
      type: team_season_points
      threshold: 11500
      reward: "🎯 Bounty Hunter role for the Season"

  # GitHub Actions secret holding each channel's Discord webhook URL.
  # awards, rankings, monthly (Monthly Awards) and bounties go to
  # 📰│weekly-recap with the recap; games (the MLB games grid) goes to the
  # scoreboard channel with the matchup preview.
  webhooks:
    recap: LEAGUE_WEBHOOK_WEEKLY_RECAP
    awards: LEAGUE_WEBHOOK_WEEKLY_RECAP
    rankings: LEAGUE_WEBHOOK_WEEKLY_RECAP
    monthly: LEAGUE_WEBHOOK_WEEKLY_RECAP
    bounties: LEAGUE_WEBHOOK_WEEKLY_RECAP
    standings: LEAGUE_WEBHOOK_STANDINGS
    playoff_race: LEAGUE_WEBHOOK_PLAYOFF_RACE
    preview: LEAGUE_WEBHOOK_SCOREBOARD
    games: LEAGUE_WEBHOOK_SCOREBOARD
    scoreboard: LEAGUE_WEBHOOK_SCOREBOARD
    playoffs: LEAGUE_WEBHOOK_PLAYOFFS
    spoon: LEAGUE_WEBHOOK_WEEKLY_RECAP

# ---------------------------------------------------------------------------
# Owner pings (opt-in)
#
# Owners listed here are mentioned:
#   - by the Wire, when a player on their PSBL roster shows up in the Injury
#     Report (wire_pings below), and
#   - by Lineup Alerts, when a hitter in the lineup has no MLB game today, or
#     a starting pitcher in it is not today's probable starter, while an
#     eligible bench player plays (lineup_alerts below).
# Only owners listed here are ever pinged, and only about their own team.
#
# Key: the PSBL team's Fantrax team name (or Fantrax team ID).
# Value: the owner's Discord user ID, in quotes. In Discord: User Settings ->
#        Advanced -> turn on Developer Mode, then right-click the member ->
#        Copy User ID.
#
# Example:
#   owners:
#     "Test 4": "123456789012345678"
owners: {}

wire_pings:
  injuries: true

# ---------------------------------------------------------------------------
# Lineup Alerts (automation/lineup/)
#
# Once a day (about 3:00 PM ET, regular season and playoffs) each owner listed
# under `owners` gets one short message, with a mention, when a hitter in
# today's ACTIVE lineup has no MLB game while an eligible RESERVE player plays,
# or an ACTIVE SP is not today's probable starter while a RESERVE SP is.
# Owners not listed under `owners` are never checked or pinged.
# webhook: GitHub Actions secret holding the 🔔│lineup-alerts webhook URL.
lineup_alerts:
  webhook: LEAGUE_WEBHOOK_LINEUP_ALERTS

# ---------------------------------------------------------------------------
# Probable Pitchers (automation/pitchers/)
#
# One message per game day in ⚾│game-day listing every MLB game's probable
# starters as MLB announces them, edited silently until the last game starts.
# Starters on a PSBL roster show their PSBL team. Nobody is pinged.
# webhook:   GitHub Actions secret holding the ⚾│game-day webhook URL.
# post_from: earliest local time the day's message is posted. The scheduler
#            checks from 09:15 (automation/scheduler/schedule.yaml).
probable_pitchers:
  webhook: LEAGUE_WEBHOOK_GAME_DAY
  post_from: "09:00"

# ---------------------------------------------------------------------------
# Morning Recap (automation/media/)
#
# Every morning after a day with MLB games (regular season and postseason),
# 📸│media gets last night's finals with the pitchers of record and MLB.com
# recap and condensed-game links, then the PSBL Home Run Reel (home runs by
# players on PSBL rosters, with clip links; left out when none of them
# homered). Links only, nothing is re-uploaded. Nobody is pinged.
# enabled:               false stops the scheduled posts (manual preview/test
#                        runs still work).
# webhook:               GitHub Actions secret holding the 📸│media webhook URL
#                        (the same one the Wire's podcast posts use).
# post_time:             earliest local time the morning post goes out. The
#                        scheduler starts the job at 08:30
#                        (automation/scheduler/schedule.yaml); keep them in step.
# include_home_run_reel: false leaves out the reel (no Fantrax roster read).
morning_recap:
  enabled: true
  webhook: LEAGUE_WEBHOOK_MEDIA
  post_time: "08:30"
  include_home_run_reel: true

# ---------------------------------------------------------------------------
# Commissioner Desk (private reminders for the commissioner's manual work)
#
# webhook:      GitHub Actions secret holding the private channel's webhook URL.
# ping_user_id: optional. Your Discord user ID, in quotes, to get an @mention
#               with each reminder. Leave "" for a silent post.
commissioner_desk:
  webhook: LEAGUE_WEBHOOK_COMMISSIONER_DESK
  ping_user_id: "1059135310132424814"

# ---------------------------------------------------------------------------
# Trade Desk (automation/trades/)
#
# Every trade Fantrax processes gets a report card in 💬│trade-discussion with
# a "Who won the trade?" poll (just for fun; it never affects the trade,
# Article XI), and a revisit 6 and 12 months later. On trade-deadline day the
# PSBL DEADLINE DAY TRADE CENTER tracker in 📢│announcements counts down to the deadline.
# webhooks:   GitHub Actions secrets holding each channel's webhook URL. A
#             missing secret skips that post without failing the run.
# poll_hours: how long the poll stays open.
trade_desk:
  webhooks:
    discussion: LEAGUE_WEBHOOK_TRADE_DISCUSSION
    announcements: LEAGUE_WEBHOOK_LEAGUE_ANNOUNCEMENTS
  poll_hours: 72

# ---------------------------------------------------------------------------
# Draft Center (automation/draft/)
#
# Countdown, draft-order reveal and round-by-round recap in Discord, plus a
# private Commissioner Desk alert when a pick clock runs out or a pick is
# skipped. No on-the-clock or per-pick posts: Fantrax sends those.
# The draft date, order, rounds and picks come from Fantrax. Fantrax does not
# publish the pick clock, so it is set here from the Constitution.
draft_center:
  webhooks:
    announcements: LEAGUE_WEBHOOK_DRAFT_ANNOUNCEMENTS
    results: LEAGUE_WEBHOOK_DRAFT_RESULTS
  # Countdown posts before the Fantrax draft date. The first one sent is the
  # full announcement (Art. 5.9: announce at least 30 days ahead).
  countdown: ["30d", "7d", "1d", "1h", "start"]
  # When the official draft order is posted, before the draft date.
  order_reveal: "7d"
  # Nightly pick-clock pause, Eastern time (Art. 13.4, 14.3).
  pause: ["00:00", "08:00"]
  drafts:
    startup:
      pick_clock_hours: 4   # Art. 13.1
    annual:
      pick_clock_hours: 8   # Art. 14.3
  # TEST ONLY: pick clock in minutes for a fast test draft. Set back to null
  # before the real startup draft.
  test_pick_clock_minutes: null

# ---------------------------------------------------------------------------
# League history (automation/history/)
#
# rivals: declared rivalries, as pairs. Each side may be a franchise key from
#         automation/history/history.yaml, a Fantrax team ID or a team name.
#         Every franchise also has an "earned" rival worked out from the
#         archive: the opponent it has played most (closest record breaks ties).
#
# Example:
#   rivals:
#     - ["sandlot-kings", "dugout-dogs"]
#     - ["Test 4", "Test 7"]
rivals: []

# ---------------------------------------------------------------------------
# League history website (tools/build_site.py, workflow PSBL History Site)
#
# A standalone site on Cloudflare Pages. Nothing on it points to GitHub.
# url:                the site's own address once the domain is connected,
#                     e.g. "https://psbl-history.pages.dev" (no trailing slash). Used
#                     for search engines and link previews; leave "" until then.
# cloudflare_project: the Cloudflare Pages project name. Its free address is
#                     https://<project>.pages.dev until the domain is added.
history_site:
  url: ""
  cloudflare_project: psbl-history

history:
  # GitHub Actions secret holding each channel's Discord webhook URL.
  # Draft retrospectives post to draft_center.webhooks.results above.
  webhooks:
    dynasty_pot: LEAGUE_WEBHOOK_LEAGUE_LEDGER
    franchise_directory: LEAGUE_WEBHOOK_FRANCHISE_DIRECTORY
