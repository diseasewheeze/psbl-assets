fantrax:
  # Tag stories with the DBL team that rosters the player. The league comes
  # from automation/league.yaml; owner pings are configured there too.
  roster_enrichment: true

# Every feed below was loaded on 2026-10-15 and showed current items, unless a
# note says otherwise. A source marked baseline_first: true posts nothing on
# its first live run (its current items are only remembered), so adding one
# never floods a channel with old stories.
sources:
  # OFFICIAL TRANSACTIONS: the one source that posts in mlb-transactions.
  # Injured-list moves and rehab assignments go to injury-report.
  - id: mlb_transactions
    name: MLB Transactions
    type: mlb_transactions
    url: https://statsapi.mlb.com/api/v1/transactions
    tier: 0
    breaking_allowed: false
    discovery_only: false
    enabled: true
    lookback_days: 1
    max_items: 60
    baseline_first: true
    role: primary-official-transactions
    note: MLB Stats API transaction log (sportId=1). Each move is posted once by its own record; a trade is one post naming every player in it. Players are tagged by name and MLB team.

  # PRIMARY MLB NEWS
  - id: mlb_news
    name: MLB.com News
    type: rss
    url: https://www.mlb.com/feeds/news/rss.xml
    tier: 0
    breaking_allowed: true
    discovery_only: false
    enabled: true
    max_items: 10
    baseline_first: true
    role: primary-official-news

  - id: mlb_trade_rumors
    name: MLB Trade Rumors
    type: rss
    url: https://feeds.feedburner.com/MlbTradeRumors
    tier: 1
    breaking_allowed: false
    discovery_only: false
    enabled: true
    max_items: 10
    baseline_first: true
    role: primary-transactions-free-agency-news
    note: The site's own /feed address served a copy frozen in January 2018 on 2026-10-15; the FeedBurner address is current. Its transaction headlines are recorded but not posted (MLB Transactions posts the move).

  - id: cbs_mlb
    name: CBS Sports MLB
    type: rss
    url: https://www.cbssports.com/rss/headlines/mlb
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: true
    max_items: 10
    role: corroboration-national-news
    note: Healthy feed, but it mixes betting promos and other sports into MLB headlines. Manual discovery only.

  - id: espn_mlb
    name: ESPN MLB
    type: rss
    url: https://www.espn.com/espn/rss/mlb/news
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: false
    note: Returned an empty body on 2026-10-15. Re-check with a manual shadow run before enabling.

  # PROSPECT / DEVELOPMENT COVERAGE
  - id: fangraphs_prospects
    name: FanGraphs Prospects
    type: rss
    url: https://blogs.fangraphs.com/category/prospects/feed/
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    force_channel: prospect-wire
    max_items: 6
    baseline_first: true
    role: prospect-analysis

  - id: prospects_live
    name: Prospects Live
    type: rss
    url: https://www.prospectslive.com/feed/
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    force_channel: prospect-wire
    max_items: 6
    baseline_first: true
    role: dynasty-prospect-analysis

  - id: milb_news
    name: MiLB.com News
    type: rss
    url: https://www.milb.com/feeds/news/rss.xml
    tier: 1
    breaking_allowed: false
    discovery_only: true
    enabled: false
    force_channel: prospect-wire
    note: Loads, but its newest item on 2026-10-15 was from August 2025. Not posted while it is stale.

  # COMMUNITY / DISCOVERY
  - id: reddit_baseball
    name: r/baseball
    type: rss
    url: https://www.reddit.com/r/baseball/.rss
    tier: 3
    breaking_allowed: false
    discovery_only: true
    enabled: false
    max_items: 10
    role: community-discovery
    note: Not verified; reddit.com could not be reached from the 2026-10-15 check. Discovery only (reporter-attributed posts) once a manual shadow run shows it loads.

  # PODCASTS: one post per new episode in 📸│media
  - id: pod_fantasy_baseball_today
    name: Fantasy Baseball Today (CBS Sports)
    type: rss
    url: https://rss.amperwave.net/v2/feed/audacynetwork/d4bae8cf54f36afd204b93ed7355d137
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    max_items: 3
    force_channel: media
    baseline_first: true
    role: podcast-episodes

  - id: pod_prospects_live
    name: Prospects Live Podcast (dynasty)
    type: rss
    url: https://www.spreaker.com/show/3147987/episodes/feed
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    max_items: 3
    force_channel: media
    baseline_first: true
    role: podcast-episodes

  - id: pod_locked_on_fantasy_baseball
    name: Locked On Fantasy Baseball
    type: rss
    url: https://feeds.simplecast.com/4vzt_3en
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    max_items: 3
    force_channel: media
    baseline_first: true
    role: podcast-episodes

  - id: pod_pitcher_list
    name: Pitcher List Fantasy Baseball
    type: rss
    url: https://feeds.simplecast.com/Rbrm7xIB
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    max_items: 3
    force_channel: media
    baseline_first: true
    role: podcast-episodes

  - id: pod_in_this_league
    name: In This League Fantasy Baseball
    type: rss
    url: https://www.spreaker.com/show/3691391/episodes/feed
    tier: 2
    breaking_allowed: false
    discovery_only: false
    enabled: true
    max_items: 3
    force_channel: media
    baseline_first: true
    role: podcast-episodes

planned_sources:
  - id: baseball_america
    name: Baseball America
    type: rss
    status: candidate
    note: Its feed refused automated reads on 2026-10-15 (robots rules).

  - id: x_reporters
    name: Selected X reporter accounts
    type: social
    status: deferred-until-stable-feed-method
