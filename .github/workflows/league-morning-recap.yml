name: DBL Morning Recap
run-name: DBL Morning Recap — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Every morning after a day with MLB games: last night's finals with MLB.com
# recap and condensed-game links and the DBL Home Run Reel in 📸│media, once
# per MLB date. Timing lives in automation/scheduler/schedule.yaml (08:30 ET,
# all year). Code: automation/media/morning.py. Settings: automation/league.yaml
# (morning_recap).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = [TEST] posts, nothing recorded; live = post last night once"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]
      date:
        description: "Optional MLB date YYYY-MM-DD (default: yesterday)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: dbl-morning-recap
  cancel-in-progress: false

jobs:
  morning-recap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
      MLB_DATE: ${{ inputs.date || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/media/state/morning_recap.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Morning Recap
        env:
          LEAGUE_WEBHOOK_MEDIA: ${{ secrets.LEAGUE_WEBHOOK_MEDIA }}
        shell: bash
        run: |
          ARGS=(--mode "$MODE")
          if [[ -n "$MLB_DATE" ]]; then ARGS+=(--date "$MLB_DATE"); fi
          python automation/media/morning.py "${ARGS[@]}"

      # Saved even if a post failed, so the parts that did go out are never repeated.
      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(media): save morning recap state" \
            "DBL Fantrax Automation" \
            "automation/media/state/morning_recap.json"
