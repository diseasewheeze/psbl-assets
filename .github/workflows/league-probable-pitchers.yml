name: DBL Probable Pitchers
run-name: DBL Probable Pitchers — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# One "Probable Pitchers" message per game day in ⚾│game-day, edited silently
# when MLB changes an announced starter, until the last game starts. Timing
# lives in automation/scheduler/schedule.yaml (several checks a day, regular
# season and playoffs). Code: automation/pitchers/probables.py.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = new [TEST] post; live = post or edit today's message"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]

permissions:
  contents: write

concurrency:
  group: dbl-probable-pitchers
  cancel-in-progress: false

jobs:
  probables:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/pitchers/state/probable_pitchers.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Run Probable Pitchers
        env:
          LEAGUE_WEBHOOK_GAME_DAY: ${{ secrets.LEAGUE_WEBHOOK_GAME_DAY }}
        run: python automation/pitchers/probables.py --mode "$MODE"

      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(pitchers): save probable pitchers state" \
            "DBL Fantrax Automation" \
            "automation/pitchers/state/probable_pitchers.json"
