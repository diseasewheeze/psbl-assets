name: DBL Prospect Board
run-name: DBL Prospect Board — ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}

# Private prospect board (MLB's ranked draft prospects) for Commissioner Desk.
# Timing lives in automation/scheduler/schedule.yaml, where the job is switched
# off until MLB publishes the next draft prospect list (empty on 2026-10-15);
# manual runs work at any time. Posts go to the Commissioner Desk channel.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = log only; test = one [TEST] sample board; live = post the board if rankings changed"
        required: true
        default: preview
        type: choice
        options: [preview, test, live]

permissions:
  contents: write

concurrency:
  group: dbl-prospect-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Restore saved state
        run: bash automation/tools/state_branch.sh restore "automation/commissioner/state/prospects.json"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/common-requirements.txt

      - name: Install dependencies
        run: pip install -r automation/common-requirements.txt

      - name: Post prospect board
        env:
          LEAGUE_WEBHOOK_COMMISSIONER_DESK: ${{ secrets.LEAGUE_WEBHOOK_COMMISSIONER_DESK }}
        run: python automation/commissioner/prospects.py --mode "$MODE"

      # Saved even if a later step fails, so a posted alert is never repeated.
      - name: Save state to the automation-state branch
        if: ${{ !cancelled() && env.MODE == 'live' }}
        run: |
          bash automation/tools/state_branch.sh save \
            "chore(commissioner): save prospect board" \
            "DBL Fantrax Automation" \
            "automation/commissioner/state/prospects.json"
